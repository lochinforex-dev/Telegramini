name: Make upload keystore

# One-time job: creates the signing key INSIDE GitHub and stores it straight into Secrets.
# Nothing is printed, nothing is committed. Needs the secret SECRETS_PAT (see the instructions).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - name: Create keystore and save it to Secrets
        env:
          GH_TOKEN: ${{ secrets.SECRETS_PAT }}
        run: |
          set -e
          if [ -z "$GH_TOKEN" ]; then
            echo "SECRETS_PAT secret is missing"; exit 1
          fi
          # never overwrite an existing key
          if gh secret list --repo "$GITHUB_REPOSITORY" | grep -q '^KEYSTORE_B64'; then
            echo "KEYSTORE_B64 already exists. Delete it first if you really want a new key."; exit 1
          fi
          PASS=$(openssl rand -hex 20)
          echo "::add-mask::$PASS"
          keytool -genkeypair -keystore upload.jks -storetype PKCS12 \
            -alias fastmessenger -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=FastMessenger, O=FastMessenger, C=UZ" >/dev/null 2>&1
          base64 -w0 upload.jks > upload.b64
          gh secret set KEYSTORE_B64 --repo "$GITHUB_REPOSITORY" < upload.b64
          gh secret set KEYSTORE_PASSWORD --repo "$GITHUB_REPOSITORY" --body "$PASS"
          gh secret set KEY_ALIAS --repo "$GITHUB_REPOSITORY" --body "fastmessenger"
          gh secret set KEY_PASSWORD --repo "$GITHUB_REPOSITORY" --body "$PASS"
          shred -u upload.jks upload.b64 || rm -f upload.jks upload.b64
          echo "Done: KEYSTORE_B64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD saved to Secrets."
